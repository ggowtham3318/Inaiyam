project_id = "inaiyam-matrimony"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "30s"

[auth.email.template.confirmation]
subject = "Confirm your Inaiyam account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Inaiyam sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Inaiyam password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_confirmations = false
enable_signup = false
max_frequency = "30s"

[auth.sms.test_otp]
"+919876543210" = "123456"

[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/send-sms"
secrets = "env(SEND_SMS_HOOK_SECRET)"

[auth.rate_limit]
sms_sent = 5
token_verifications = 10
email_sent = 5

[api]
enabled = true
schemas = ["public", "graphql_public", "app"]

[db]
major_version = 15

[functions.review-photo]
verify_jwt = true

[functions.send-sms]
verify_jwt = false
